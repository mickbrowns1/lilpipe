# Start:  docker compose up -d --build     Stop:  docker compose down
# Then open http://127.0.0.1:8790
services:
  trickle:
    build:
      context: .
      target: app
    image: trickle:latest
    container_name: trickle
    restart: unless-stopped
    ports:
      # Published on this machine only. Do not change 127.0.0.1 to 0.0.0.0:
      # the app can run Vector and Lua code, so it must not be reachable from the network.
      - "127.0.0.1:8790:8790"
    volumes:
      - ./pipelines:/app/pipelines   # saved pipelines (survive rebuilds)
      - ./output:/app/output         # files written by the "Save to file" destination
      - ./data:/data:ro              # put log files and serializers here; use /data/name in the app

  # Busted specs for the serializers:  docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    image: trickle-tests:latest
    working_dir: /app
    volumes:
      - ./spec:/app/spec:ro
      - ./data:/app/data:ro
